
services:
  - type: web
    name: electronic-shop
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: electronic-shop-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true

databases:
  - name: electronic-shop-db
    plan: free
