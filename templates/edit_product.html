
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #252b48;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #5146e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            color: #5146e5;
        }

        .message {
            padding: 10px;
            background: #eef2ff;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Edit Product</h1>
        <p>Update the details for {{ product.product_name }}.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('update_product', product_id=product.product_id) }}">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <label for="sku">SKU / Product Code</label>
            <input type="text" id="sku" name="sku"
                   value="{{ product.sku }}" maxlength="20" required>

            <label for="product_name">Product Name</label>
            <input type="text" id="product_name" name="product_name"
                   value="{{ product.product_name }}"
                   maxlength="120" required>

            <label for="brand">Brand</label>
            <input type="text" id="brand" name="brand"
                   value="{{ product.brand }}" maxlength="60" required>

            <label for="category_id">Category</label>
            <select id="category_id" name="category_id" required>
                {% for category in categories %}
                    <option value="{{ category.category_id }}"
                        {% if category.category_id == product.category_id %}
                            selected
                        {% endif %}>
                        {{ category.category_name }}
                    </option>
                {% endfor %}
            </select>

            <label for="launch_year">Launch Year (optional)</label>
            <input type="number" id="launch_year" name="launch_year"
                   min="1900" max="2100"
                   value="{{ product.launch_year or '' }}">

            <label for="unit_price">Unit Price (₹)</label>
            <input type="number" id="unit_price" name="unit_price"
                   min="0.01" step="0.01"
                   value="{{ product.unit_price }}" required>

            <label for="stock_quantity">Stock Quantity</label>
            <input type="number" id="stock_quantity" name="stock_quantity"
                   min="0" step="1"
                   value="{{ product.stock_quantity }}" required>

            <label for="warranty_months">Warranty (months)</label>
            <input type="number" id="warranty_months"
                   name="warranty_months" min="0" step="1"
                   value="{{ product.warranty_months }}" required>

            <button type="submit">Save Changes</button>
            <a class="back" href="{{ url_for('manage_products') }}">
                Cancel
            </a>
        </form>
    </div>
</body>
</html>
