
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restock Product</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #252b48;
        }

        .details {
            background: #f4f6f9;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #5146e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            color: #5146e5;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Restock Product</h1>

        <div class="details">
            <p><strong>Product:</strong> {{ product.product_name }}</p>
            <p><strong>SKU:</strong> {{ product.sku }}</p>
            <p><strong>Current Stock:</strong> {{ product.stock_quantity }}</p>
        </div>

        <form method="POST"
              action="{{ url_for('restock_product', product_id=product.product_id) }}">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <label for="quantity">Quantity Received</label>
            <input type="number" id="quantity" name="quantity"
                   min="1" step="1" required>

            <button type="submit">Add Stock</button>

            <a class="back" href="{{ url_for('manage_products') }}">
                Cancel
            </a>
        </form>
    </div>
</body>
</html>
